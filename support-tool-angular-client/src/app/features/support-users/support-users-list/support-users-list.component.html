<div class="support-users-container">
    <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>
  
    <ng-container *ngIf="!loading">
      <div class="button-container">
        <button mat-raised-button color="primary" (click)="handleClickOpen()">
          <mat-icon>add</mat-icon> Add new support user
        </button>
      </div>
  
      <div *ngIf="users.length > 0; else noUsers">
        <mat-table [dataSource]="users" class="mat-elevation-z2">
          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <mat-header-cell *matHeaderCellDef>Name</mat-header-cell>
            <mat-cell *matCellDef="let row">{{row.firstName}} {{row.lastName}}</mat-cell>
          </ng-container>
  
          <!-- Username Column -->
          <ng-container matColumnDef="username">
            <mat-header-cell *matHeaderCellDef>Username</mat-header-cell>
            <mat-cell *matCellDef="let row">{{row.userName}}</mat-cell>
          </ng-container>
  
          <!-- User ID Column -->
          <ng-container matColumnDef="userId">
            <mat-header-cell *matHeaderCellDef>User ID</mat-header-cell>
            <mat-cell *matCellDef="let row">{{row.userId}}</mat-cell>
          </ng-container>
  
          <!-- Roles Column -->
          <ng-container matColumnDef="roles">
            <mat-header-cell *matHeaderCellDef>Roles</mat-header-cell>
            <mat-cell *matCellDef="let row">{{row.roles}}</mat-cell>
          </ng-container>
  
          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <mat-header-cell *matHeaderCellDef align="end">Actions</mat-header-cell>
            <mat-cell *matCellDef="let row" align="end">
              <button mat-icon-button (click)="handleEditOpen(row)" aria-label="edit">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button (click)="handleDeleteOpen(row)" aria-label="delete">
                <mat-icon>delete</mat-icon>
              </button>
            </mat-cell>
          </ng-container>
  
          <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
          <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>
      </div>
      
      <ng-template #noUsers>
        <mat-card>
          <mat-card-content>
            <div class="info-alert">
              <mat-icon>info</mat-icon>
              <span>No support users available. Create one by clicking on add new support user.</span>
            </div>
          </mat-card-content>
        </mat-card>
      </ng-template>

  </div>
