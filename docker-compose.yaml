version: '3.8'

services:
  support-tool:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: support-tool-app
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
    env_file:
      - ./support-tool-server/.env
      - ./support-tool-react-client/.env
    volumes:
      # Mount logs directory for persistence with proper permissions
      - support-tool-logs:/support-tool-server/logs
    restart: unless-stopped
    networks:
      - support-tool-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  support-tool-network:
    driver: bridge

volumes:
  support-tool-logs:
